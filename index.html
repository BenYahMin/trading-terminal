<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Master Trading Terminal v1.1 📈</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">Master Terminal <span style="color:var(--accent)">v1.1</span></h1>
            <p style="margin:5px 0 0 0; color:var(--dim); font-size: 0.8rem;">Performance Lab for MT5 Reports</p>
        </div>
        <input type="file" id="fileInput" accept=".html" style="display:none">
        <button class="btn-main" onclick="document.getElementById('fileInput').click()">Sync Account Report 🔄</button>
    </div>

    <div class="top-grid">
        <div class="card">
            <div class="card-title">Total Performance</div>
            <div id="totalProfit" class="hero-val">0.00</div>
            <div id="winRate" style="color:var(--dim); margin-top: 10px; font-size: 0.9rem;">Win Rate: 0%</div>
            <hr style="border:0; border-top:1px solid #222; margin: 20px 0;">
            <div class="card-title">Directional Bias</div>
            <div id="sideStats"></div>
        </div>
        <div class="card">
            <div class="card-title">Equity Growth Curve</div>
            <canvas id="equityChart"></canvas>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="card-title">Pre-Trade Checklist 🛡️</div>
            <label class="check-item"><input type="checkbox" class="guard"> Trend Alignment Check</label>
            <label class="check-item"><input type="checkbox" class="guard"> Structural Stop Loss Set</label>
            <label class="check-item"><input type="checkbox" class="guard"> News Calendar Checked</label>
            <label class="check-item"><input type="checkbox" class="guard"> Emotion Check: Neutral</label>
            <button id="lockBtn" class="btn-lock">LOCKED 🔒</button>
        </div>

        <div class="card">
            <div class="card-title">Risk Calculator 🧪</div>
            <label style="font-size:0.7rem; color:var(--dim)">Stop Loss (Pips)</label>
            <input type="number" id="riskSL" class="sim-input" value="50" oninput="calcRisk()">
            <label style="font-size:0.7rem; color:var(--dim)">Risk Percentage (%)</label>
            <input type="number" id="riskPerc" class="sim-input" value="1" step="0.5" oninput="calcRisk()">
            <div style="background:#000; padding:15px; border-radius:8px; border-left: 3px solid var(--accent)">
                <div style="font-size:0.7rem; color:var(--dim)">LOT SIZE TO USE:</div>
                <div id="lotSizeResult" style="font-size:1.5rem; font-weight:800; color:var(--accent)">0.00</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Session Profits (EAT) 🕒</div>
            <div id="sessionStats"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Asset Performance Ranking</div>
        <div id="pairStats"></div>
    </div>

    <div id="console">Terminal Ready. Waiting for MT5 HTML Report...</div>
</div>
</body>
</html>
